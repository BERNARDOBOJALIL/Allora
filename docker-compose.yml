version: "3.9"

services:
  # ── MongoDB (required by auth-service) ──
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - allora-network
    restart: unless-stopped

  # ── Redis cache (required by api-gateway) ──
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - allora-network
    restart: unless-stopped

  # ── Autenticación y usuarios (auth-service) ───────────────
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allora-network
    depends_on:
      - mongodb
      - redis

  # ── Puerta de entrada principal (api-gateway) ─────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      JWT_ALGORITHM: RS256
      JWT_ISSUER: auth-service
      REDIS_URL: redis://redis:6379/0
      USERS_SERVICE_URL: http://user-service:8005
      CHAT_SERVICE_URL: http://chat-service:8001
      MATCHES_SERVICE_URL: http://match-service:8002
      NOTIFICATIONS_SERVICE_URL: http://notification-service:8004
    restart: unless-stopped
    networks:
      - allora-network
    depends_on:
      auth-service:
        condition: service_healthy

  # Location Service - Real-time location tracking
  location-service:
    build:
      context: ./services/location-service
      dockerfile: Dockerfile
    container_name: location-service
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=location-service
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8003
      - DEBUG=False
      - AUTH_JWT_SECRET=change_this_secret
      - AUTH_JWT_ALGORITHM=HS256
      - AUTH_SERVICE_URL=http://auth-service:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - allora-network
    restart: unless-stopped
    depends_on:
      - auth-service

  # Chat Service (placeholder)
  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    ports:
      - "8001:8001"
    networks:
      - allora-network
    restart: unless-stopped

  # Match Service (placeholder)
  match-service:
    build:
      context: ./services/match-service
      dockerfile: Dockerfile
    container_name: match-service
    ports:
      - "8002:8002"
    networks:
      - allora-network
    restart: unless-stopped

  # Notification Service (placeholder)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8004:8004"
    networks:
      - allora-network
    restart: unless-stopped

  # User Service (placeholder)
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8005:8005"
    networks:
      - allora-network
    restart: unless-stopped

networks:
  allora-network:
    driver: bridge

volumes:
  mongo_data:
